<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="style.css">

<body>
<header class="top"><div class="brand"><img src="../Logo.png" alt="" style="height: 100px;width: 200px;"><div><st><strong><st><st><st><st style="font-family: 'Times New Roman', Times, serif; font-weight: bold; font-size: medium;">HÒA PHÁT DUNG QUẤT</st></st></st></st></strong></st><small style="font-family: 'Times New Roman', Times, serif; font-weight: bold;">Hệ thống điện</small></div></div><button id="theme" type="button">◐ Chế độ tối</button></header>

<main>
